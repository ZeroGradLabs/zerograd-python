name: Benchmark

# On demand: the benchmark in benchmarks/run.py (one job per OpenML dataset, classification and regression, CPU) and the README GIF.
# Results: the "benchmark-results" artifact (results.csv + summary.md) and the "demo-gif" artifact.
on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds per dataset"
        default: "3"
      gif:
        description: "Also re-record docs/demo.gif"
        type: boolean
        default: true

env:
  ZEROGRAD_QUIET: "1"
  TQDM_DISABLE: "1"

jobs:
  dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # classification, then regression (benchmarks/run.py picks the task from the id)
        dataset: [31, 37, 1464, 1494, 1067, 40981, 40701, 1489, 40983, 1487, 23, 54, 560, 44132, 44136, 44138, 44145, 44147]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/tabpfn
            ~/.cache/tabicl
          key: model-weights-v1
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[all]" --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
      - run: uv run python benchmarks/run.py --datasets ${{ matrix.dataset }} --seeds ${{ inputs.seeds }} --out part-${{ matrix.dataset }}.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-${{ matrix.dataset }}
          path: part-${{ matrix.dataset }}.csv
          if-no-files-found: warn

  summary:
    needs: dataset
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --with pandas python benchmarks/summarize.py part-*.csv --out results.csv | tee summary.md
      - run: cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results.csv
            summary.md

  gif:
    if: inputs.gif
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[all]" --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
      - name: Warm up (downloads the weights so the GIF shows none)
        run: |
          start=$(date +%s)
          uv run python examples/demo.py
          echo "Demo took $(( $(date +%s) - start ))s after the warm-up downloads" >> "$GITHUB_STEP_SUMMARY"
          start=$(date +%s)
          uv run python examples/demo.py
          echo "Demo takes $(( $(date +%s) - start ))s with cached weights" >> "$GITHUB_STEP_SUMMARY"
        env:
          ZEROGRAD_QUIET: ""
      - name: Record
        uses: charmbracelet/vhs-action@v2
        with:
          path: scripts/demo.tape
        env:
          ZEROGRAD_QUIET: ""
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
          PATH: ${{ github.workspace }}/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - uses: actions/upload-artifact@v4
        with:
          name: demo-gif
          path: docs/demo.gif
