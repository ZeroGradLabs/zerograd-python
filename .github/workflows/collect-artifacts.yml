name: Collect artifacts

# On demand: copy every artifact of a finished run to the branch artifacts/<run id>, so they can be fetched with git.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: out
      - run: |
          cd out
          git init -q -b "artifacts/${{ inputs.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Artifacts of run ${{ inputs.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "HEAD:artifacts/${{ inputs.run_id }}"
