name: zeus-hash (temporary)
on:
  pull_request:
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -o zeus.pt "https://drive.usercontent.google.com/download?id=1D7uikacymUnmmMxjUjBuCNIomqhBWS67&export=download&confirm=t"
          ls -l zeus.pt
          sha256sum zeus.pt
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; c=torch.load('zeus.pt', map_location='cpu', weights_only=True); print('weights_only OK', type(c).__name__, list(c)[:5])" || echo "weights_only FAILED"
