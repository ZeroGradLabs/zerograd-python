[project]
name = "zerograd"
dynamic = ["version"]
description = "Predictions over your tabular data with open foundation models (TabPFN, TabICL, Mitra, TabDPT). Nothing to train."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ZeroGrad" }]
keywords = ["tabular", "foundation-models", "tabpfn", "tabicl", "mitra", "tabdpt", "classification", "regression", "automl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25",
    "numpy>=1.25",
    "pandas>=1.5",
    "pyarrow>=12",
    "scikit-learn>=1.3",
    # The local engine and its two default models. Weights download from Hugging Face on first use.
    "torch>=2.5",
    "tabpfn>=2.1",
    "tabicl>=2.0",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
]

[project.optional-dependencies]
# The base install already runs locally with TabPFN v2 and TabICLv2. "local" is kept so `zerograd[local]` works.
local = []
mitra = ["autogluon.tabular[mitra]>=1.6"]
tabdpt = ["tabdpt>=1.3"]
# NVIDIA Kumo-Tabular. Its package needs Python 3.11 or newer.
kumo = ["structured-data-models>=0.3; python_version >= '3.11'"]
# The MCP server for agents (Claude Code, Cursor, Codex...): `zerograd-mcp`.
mcp = ["mcp>=2"]
all = ["zerograd[mitra,tabdpt,kumo,mcp]"]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.5", "mcp>=2"]

[project.scripts]
zerograd-mcp = "zerograd.mcp_server:main"

[project.urls]
Homepage = "https://zerograd.dev"
Documentation = "https://zerograd.dev/docs"
Source = "https://github.com/zerogradlabs/zerograd-python"
Issues = "https://github.com/zerogradlabs/zerograd-python/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "zerograd/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["zerograd"]

[tool.hatch.build.targets.wheel.force-include]
# The MCP server's read_docs tool reads these from the installed package, offline.
"README.md" = "zerograd/_docs/README.md"
"MODELS.md" = "zerograd/_docs/MODELS.md"

[tool.hatch.build.targets.sdist]
include = ["zerograd", "tests", "README.md", "LICENSE", "NOTICE", "TERMS.md", "MODELS.md", "CHANGELOG.md", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["zerograd/models/_vendor"]  # third-party model code, kept as the authors wrote it

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008", "B905"]
